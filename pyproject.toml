[project]
name = "ai-saas-kit"
version = "0.2.0"
description = "Token budget and rate limit helpers for AI SaaS."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []
[project.optional-dependencies]
dev = ["pytest>=7.4"]
[project.urls]
Source = "https://github.com/MichaelSwann2x/ai-saas-kit"
Original = "https://github.com/mirkovicdev/AI-saas"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/ai_saas_kit"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
